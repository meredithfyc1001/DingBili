name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build single-file userscript
        run: npm run build

      - name: Verify committed dist matches fresh build
        run: git diff --exit-code dist/DingBili.user.js

      - name: Run unit tests
        run: npm run test:unit

      - name: Verify reproducible build (2 clean directories)
        run: npm run verify:repro
